name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: klevliga_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: klevliga_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U klevliga_test -d klevliga_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KLEVLIGA_TEST_DATABASE_URL: postgres://klevliga_test:test_only_password@127.0.0.1:5432/klevliga_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go tool sqlc generate
      - run: git diff --exit-code -- internal/storages/postgres/sqlc
      - run: go vet ./...
      - run: go test -count=1 -race -tags=integration ./...
      - run: go build ./cmd/...
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results
          retention-days: 7
