version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/storages/postgres/sqlc/queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/storages/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "date"
            go_type:
              import: "time"
              type: "Time"
