server:
  http:
    address: ${API_ADDRESS:127.0.0.1:8080}
    trust_loopback_proxy: ${TRUST_LOOPBACK_PROXY:false}

connections:
  postgres:
    main:
      # KV pairs. Same behavior as pgxpool.ParseConfig.
      host: ${DB_HOST}
      port: ${DB_PORT:5432}
      user: ${DB_USER}
      password: ${DB_PASSWORD}
      dbname: ${DB_NAME}
      search_path: ${DB_SCHEMA:}
      pool_max_conns: ${DB_POOL_MAX_CONNS:}
      pool_min_conns: ${DB_POOL_MIN_CONNS:}

auth:
  session_ttl: 720h
  cookie_name: klevliga_session
  cookie_secure: ${COOKIE_SECURE:false}
  cookie_domain: ""
  verification_ttl: 10m
  verification_secret: ${AUTH_VERIFICATION_SECRET}

mail:
  # log prints the code to the API log for local development; smtp sends email.
  mode: ${MAIL_MODE:log}
  tls_mode: ${SMTP_TLS_MODE:auto}
  address: ${SMTP_ADDRESS:}
  username: ${SMTP_USERNAME:}
  password: ${SMTP_PASSWORD:}
  from: ${SMTP_FROM:}

logger:
  title: ${APP_NAME:klevliga-api}
  level: debug
  pretty: true
