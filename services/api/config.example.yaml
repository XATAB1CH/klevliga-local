server:
  http:
    address: ":8080"

connections:
  postgres:
    main:
      # KV pairs. Same behavior as pgxpool.ParseConfig.
      host: ${DB_HOST}
      port: ${DB_PORT:5432}
      user: ${DB_USER}
      password: ${DB_PASSWORD}
      dbname: ${DB_NAME}
      search_path: ${DB_SCHEMA:}
      pool_max_conns: ${DB_POOL_MAX_CONNS:}
      pool_min_conns: ${DB_POOL_MIN_CONNS:}

auth:
  session_ttl: 720h
  cookie_name: klevliga_session
  cookie_secure: false
  cookie_domain: ""

logger:
  title: ${APP_NAME:klevliga-api}
  level: debug
  pretty: true
